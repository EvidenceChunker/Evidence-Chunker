name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 테스트 실행
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: wheel 내용물 확인
        run: python -m zipfile -l dist/*.whl

      - name: Install wheel
        run: pip install dist/*.whl

      - name: 클린 디렉터리에서 import 검증
        run: cd /tmp && python -c "from evidence_chunker import EvidenceChunker, EvidenceUnit"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit

      - name: pip-audit로 의존성 취약점 스캔
        # 제외 사유와 해제 조건은 .pip-audit-ignore 주석 참고.
        run: |
          pip-audit $(grep -v '^#' .pip-audit-ignore | grep -v '^$' | sed 's/^/--ignore-vuln /')
